
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>BOSS競馬AI</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f2f4f7;
      padding: 16px;
      color: #222;
    }
    h1 { text-align: center; }
    .card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      max-width: 500px;
      margin: 12px auto;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      background: #1463cc;
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 15px;
    }
    #preview {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>BOSS競馬AI</h1>

  <div class="card">
    <h2>出馬表入力</h2>

    <label>開催日</label>
    <input type="date" id="date">

    <label>競馬場</label>
    <select id="course">
      <option>東京</option>
      <option>中山</option>
      <option>京都</option>
      <option>阪神</option>
      <option>中京</option>
      <option>新潟</option>
      <option>福島</option>
      <option>小倉</option>
      <option>札幌</option>
      <option>函館</option>
    </select>

    <label>レース番号</label>
    <input type="number" id="race" min="1" max="12">

    <label>馬ID</label>
    <input type="text" id="horseId">

    <label>馬名</label>
    <input type="text" id="horseName">

　　　<label>枠番</label>
<input type="number" id="frame" min="1" max="8">

<label>馬番</label>
<input type="number" id="horseNumber" min="1" max="18">

<label>斤量（kg）</label>
<input type="number" id="weight" min="40" max="70" step="0.5">

<label>騎手</label>
<input type="text" id="jockey">

    <button onclick="addHorse()">馬を追加</button>
    <button onclick="downloadCSV()">
      CSVをダウンロード
    </button>

<button onclick="clearHorses()" style="background:#c0392b;">
  登録データを全削除
</button>

  </div>

  <div class="card">
    <h2>登録データ</h2>
    <div id="preview">まだ登録されていません</div>
  </div>

  <script>
  
const horses = JSON.parse(localStorage.getItem("boss_horses") || "[]");


function removeHorse(index) {
  horses.splice(index, 1);
  updatePreview();
}

function saveHorses() {
  localStorage.setItem("boss_horses", JSON.stringify(horses));
}

function updatePreview() {
  saveHorses();

  const preview = document.getElementById("preview");

  if (horses.length === 0) {
    preview.textContent = "まだ登録されていません";
    return;
  }

  preview.innerHTML = "";

  horses.forEach((horse, index) => {
    const row = document.createElement("div");
    row.style.padding = "10px 0";
    row.style.borderBottom = "1px solid #ddd";

    const name = document.createElement("span");
    name.textContent =
      horse.date + " " + horse.course +
      horse.race_number + "R / " + horse.horse_name;

    const button = document.createElement("button");
    button.textContent = "削除";
    button.style.background = "#c0392b";
    button.onclick = () => removeHorse(index);

    row.appendChild(name);
    row.appendChild(button);
    preview.appendChild(row);
  });
}

    function addHorse() {
      const date = document.getElementById("date").value;
      const course = document.getElementById("course").value;
      const race = document.getElementById("race").value;
      const horseId = document.getElementById("horseId").value.trim();
      const horseName = document.getElementById("horseName").value.trim();
　　　　const frame = document.getElementById("frame").value;
　　　　const horseNumber = document.getElementById("horseNumber").value;
　　　　const weight = document.getElementById("weight").value;
　　　　const jockey = document.getElementById("jockey").value.trim();

if (
  !frame ||
  !horseNumber ||
  !weight ||
  !jockey
) {
  alert("枠番・馬番・斤量・騎手をすべて入力してください");
  return;
}

if (
  Number(frame) < 1 ||
  Number(frame) > 8 ||
  Number(horseNumber) < 1 ||
  Number(horseNumber) > 18 ||
  Number(weight) < 40 ||
  Number(weight) > 70
) {
  alert("枠番・馬番・斤量の数値を確認してください");
  return;
}

      if (!date || !race || !horseId || !horseName) {
        alert("すべて入力してください");
        return;
      }

      if (+race < 1 || +race > 12) {
        alert("レース番号は1〜12です");
        return;
      }

      const raceId = date.replace(/-/g, "") +
                     "_" + course + "_" + race;

      if (horses.some(h =>
        h.race_id === raceId && h.horse_id === horseId
      )) {
        alert("この馬は登録済みです");
        return;
      }

    
horses.push({
  race_id: raceId,
  date: date,
  course: course,
  race_number: race,
  horse_id: horseId,
  horse_name: horseName,
  frame: frame,
  horse_number: horseNumber,
  weight: weight,
  jockey: jockey
});


updatePreview();
      document.getElementByI("horseId").value = "";
      document.getElementById("horseName").value = "";
    }

    function downloadCSV() {
      if (horses.length === 0) {
        alert("先に馬を登録してください");
        return;
      }

      
const fields = [
  "race_id", "date", "course",
  "race_number", "horse_id", "horse_name",
  "frame", "horse_number", "weight", "jockey"
];


      const escapeCSV = value =>
        '"' + String(value).replace(/"/g, '""') + '"';

      const csv = [
        fields.join(","),
        ...horses.map(h =>
          fields.map(f => escapeCSV(h[f])).join(",")
        )
      ].join("\r\n");

      const blob = new Blob(
        ["\uFEFF" + csv],
        { type: "text/csv;charset=utf-8" }
      );

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "entries.csv";
      a.click();
      URL.revokeObjectURL(url);
    }
 
function clearHorses() {
  if (!confirm("登録した馬をすべて削除しますか？")) {
    return;
  }

  horses.length = 0;
  updatePreview();
}

　　　updatePreview();
  </script>
</body>
</html>
